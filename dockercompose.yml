version: "3"

networks:
  nocobase:
    driver: bridge

services:
  app:
    image: nocobase/nocobase:latest
    container_name: nocobase_app
    networks:
      - nocobase
    environment:
      - APP_KEY=secret-key-nocobase-12345
      - ENCRYPTION_FIELD_KEY=secret-key-nocobase-12345
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_DATABASE=nocobase
      - DB_USER=nocobase
      - DB_PASSWORD=nocobase
    volumes:
      - app_storage:/app/nocobase/storage
    ports:
      - "13000:80"
    depends_on:
      - postgres
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:10
    container_name: nocobase_db
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: nocobase
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - nocobase

volumes:
  app_storage:
  pg_data:
