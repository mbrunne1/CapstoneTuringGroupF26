networks:
  nocobase:
    driver: bridge

services:
  app:
    image: nocobase/nocobase:latest-full
    restart: always
    networks:
      - nocobase
    depends_on:
      - postgres
    environment:
      # Application secret key for generating user tokens, etc. Replace with your own random string
      - APP_KEY=your-secret-key
      # Database type: postgres, mysql, mariadb
      - DB_DIALECT=postgres
      # Database host
      - DB_HOST=postgres
      # Database port
      - DB_PORT=5432
      # Database name
      - DB_DATABASE=nocobase
      # Database user
      - DB_USER=nocobase
      # Database password
      - DB_PASSWORD=nocobase
      # Timezone
      - TZ=Asia/Shanghai
    volumes:
      - ./storage/app:/app/nocobase/storage
    ports:
      - "13000:80"

  # If using an existing database, you can remove this postgres service
  postgres:
    image: postgres:16
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: nocobase
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
    networks:
      - nocobase
      
  # Selenium Browser Node
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb # Crucial to prevent Chrome from crashing inside docker
    networks:
      - nocobase
    ports:
      - "4444:4444" 
      - "7900:7900" 

  test-runner:
    image: python:3.11-slim
    networks:
      - nocobase
    volumes:
      - ./tests:/tests
    working_dir: /tests
    environment:
      - NOCOBASE_URL=http://host.docker.internal:13000
      - SELENIUM_URL=http://selenium-chrome:4444/wd/hub
    depends_on:
      - app
      - selenium-chrome
    command: sh -c "pip install --root-user-action=ignore -r requirements.txt && tail -f /dev/null"
