networks:
  nocobase-net:
    driver: bridge

services:
  app:
    image: nocobase/nocobase:latest-full
    restart: always
    networks:
      nocobase-net:
        aliases:
          - clicker.intranet.local
    depends_on:
      - postgres
    environment:
      - APP_KEY=your-secret-key
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nocobase
      - DB_USER=nocobase
      - DB_PASSWORD=nocobase
      - TZ=Asia/Shanghai
    volumes:
      - ./storage/app:/app/nocobase/storage

  postgres:
    image: postgres:16
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: nocobase
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
    networks:
      - nocobase-net

  squid:
    image: ubuntu/squid:latest
    container_name: squid-proxy
    restart: always
    ports:
      - "8080:8080"
      - "3128:3128"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - nocobase-net
    depends_on:
      - app