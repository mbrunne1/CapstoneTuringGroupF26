networks:
  nocobase:
    driver: bridge
 
services:
  envoy-proxy:
    image: envoyproxy/envoy:v1.32-latest
    container_name: envoy_proxy
    restart: always
    ports:
      - "8080:8080"                # PUBLIC
      - "127.0.0.1:8081:8081"      # ADMIN
      - "127.0.0.1:9901:9901"      # Envoy dashboard
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - nocobase
    depends_on:
      - app
 
  app:
    image: nocobase/nocobase:latest-full
    restart: always
    networks:
      - nocobase
    depends_on:
      - postgres
    environment:
      - APP_KEY=your-secret-key          
      - DB_DIALECT=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nocobase
      - DB_USER=nocobase
      - DB_PASSWORD=nocobase             
      - TZ=Asia/Shanghai
    volumes:
      - ./storage/app:/app/nocobase/storage
    
 
  postgres:
    image: postgres:16
    restart: always
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_DB: nocobase
      POSTGRES_PASSWORD: nocobase        
    volumes:
      - ./storage/db/postgres:/var/lib/postgresql/data
    networks:
      - nocobase

  # Selenium Browser Node
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb # Crucial to prevent Chrome from crashing inside docker
    networks:
      - nocobase
    ports:
      - "4444:4444" 
      - "7900:7900" 

  test-runner:
    image: python:3.11-slim
    networks:
      - nocobase
    volumes:
      - ./tests:/tests
    working_dir: /tests
    environment:
      - NOCOBASE_URL=http://host.docker.internal:8081
      - SELENIUM_URL=http://selenium-chrome:4444/wd/hub
    depends_on:
      - app
      - selenium-chrome
    command: sh -c "pip install --root-user-action=ignore -r requirements.txt && tail -f /dev/null"
