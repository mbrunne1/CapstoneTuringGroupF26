# Sprint 5 - Deliverable 1 (Caleb Carter)
# Squid proxy config: public access on 8080, intranet admin access on 3128

visible_hostname squid-caleb
dns_v4_first on

# Listener ports
http_port 8080 accel defaultsite=app vhost name=public_port
http_port 3128 name=intranet_port

# Forward NocoBase traffic to the app container and keep Bearer login tokens
cache_peer app parent 80 0 no-query no-digest originserver login=PASSTHRU name=nocobase_app

server_persistent_connections off
cache deny all

# Port and host definitions
acl is_public_port myportname public_port
acl is_intranet_port myportname intranet_port
acl nocobase_hosts dstdomain app clicker.intranet.local clicker.intranet.test localhost 127.0.0.1

# Block NocoBase settings pages and schema/config writes on the public port
acl admin_settings urlpath_regex -i ^/admin/settings
acl config_write urlpath_regex -i ^/api/(uiSchemas|collections|fields|roles|pm|systemSettings|desktopRoutes):(create|update|destroy|insert|remove|patch|save|add|enable|disable|move|set|reset)

http_access deny is_public_port admin_settings
http_access deny is_public_port config_write
http_access allow is_public_port

# Allow full access through the intranet proxy port
http_access allow is_intranet_port
http_access deny all

cache_peer_access nocobase_app allow nocobase_hosts
cache_peer_access nocobase_app deny all
never_direct allow nocobase_hosts